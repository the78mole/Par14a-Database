name: CI

# Lint (Ruff mit Bandit-Regeln) und Tests (Datenprüfung, Build von SQLite und Webseite)
# für jeden Pull Request und jeden Push auf main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Werkzeuge installieren (Versionen und Hashes aus requirements-dev.txt)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github scripts tests fuzz
      - name: Tests
        run: python -m pytest
