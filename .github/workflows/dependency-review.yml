name: Abhängigkeiten prüfen

# Blockiert Pull Requests, die Abhängigkeiten mit bekannten Schwachstellen ab Schweregrad
# "moderate" oder mit nicht freien Lizenzen einführen (Richtlinie in docs/SICHERHEIT.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Abhängigkeiten prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0, SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0
